[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "marcum-se-rr"
version = "1.0.0rc1"
description = "Marcum Q kernels and manuscript reproducibility code"
authors = [{name = "Zhong-Xuan Mao"}, {name = "Jing-Feng Tian"}]
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.7"
dependencies = ["numpy", "scipy", "mpmath", "matplotlib"]
[project.urls]
Paper = "https://arxiv.org/abs/2611.29209"

[tool.setuptools.packages.find]
where = ["src/python"]
